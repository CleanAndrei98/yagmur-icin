
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yağmurummm ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #c9a7ff);
    overflow: hidden;
    text-align: center;
}

.card {
    background: rgba(255,255,255,0.93);
    padding: 35px 25px;
    border-radius: 28px;
    width: 90%;
    max-width: 430px;
    box-shadow: 0 15px 40px #9b4b9270;
    animation: giris 0.8s ease;
    position: relative;
    z-index: 2;
}

h1 {
    color: #ed4c91;
    font-size: 27px;
}

p {
    color: #74405e;
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 23px;
    margin: 8px;
    background: #ff69a6;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
    background: #e9448b;
}

.heart {
    font-size: 55px;
    animation: kalp 1s infinite;
}

.floating {
    position: fixed;
    bottom: -40px;
    animation: uc 6s linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes giris {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes kalp {
    50% { transform: scale(1.2); }
}

@keyframes uc {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

#sonuc {
    color: #e83e83;
    font-size: 23px;
    font-weight: bold;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="card" id="kart">
    <div class="heart">💗</div>
    <h1>Bana kızgın mısın? 🥺</h1>
    <p>Lütfen dürüstçe cevap ver...</p>

    <button onclick="ikinciSayfa()">
        Evet 😠
    </button>

    <button onclick="ikinciSayfa()">
        Hayır 💗
    </button>
</div>

<script>
function ikinciSayfa() {
    document.getElementById("kart").innerHTML = `
        <div class="heart">🥺💞</div>
        <h1>Ne kadar kızgınsın?</h1>
        <p>Çok mu kızgınsın bana? 👉👈</p>

        <button onclick="sonSayfa()">
            Çok 😡
        </button>

        <button onclick="sonSayfa()">
            Birazcık 🥹
        </button>

        <button onclick="sonSayfa()">
            Hiç değilim 💖
        </button>
    `;
}

function sonSayfa() {
    document.getElementById("kart").innerHTML = `
        <div class="heart">❤️‍🩹</div>
        <h1>Yağmurummmm 💗</h1>
        <p id="sonuc">
            Sen bana kızgın olsanda ben seni
            çok seviyorum yağmurummmm ❤️🥹
        </p>
        <div class="heart">💖</div>
        <p>İyi ki varsınnn! 🫶🏻</p>
        <button onclick="konfetiler()">
            Bir daha tıkla 💝
        </button>
    `;

    konfetiler();
}

function konfetiler() {
    const emojiler = ["💗", "❤️", "💕", "💖", "🌸", "💘"];

    for (let i = 0; i < 30; i++) {
        const kalp = document.createElement("div");
        kalp.className = "floating";
        kalp.textContent =
            emojiler[Math.floor(Math.random() * emojiler.length)];

        kalp.style.left = Math.random() * 100 + "vw";
        kalp.style.animationDuration = (3 + Math.random() * 4) + "s";
        kalp.style.fontSize = (20 + Math.random() * 25) + "px";

        document.body.appendChild(kalp);

        setTimeout(() => kalp.remove(), 7000);
    }
}
</script>

</body>
</html>
